[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldbox"
dynamic = ["version"]
description = "A deterministic hex wargame where evolving AI commanders fight over a generated world"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []          # engine is stdlib-only, keep it that way

[project.optional-dependencies]
ui = ["pygame-ce>=2.5"]

[project.scripts]
fieldbox = "fieldbox.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "fieldbox.__version__" }

[tool.setuptools.packages.find]
include = ["fieldbox*"]
